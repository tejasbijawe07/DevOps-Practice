version: "3.9"

services:

  app:
    build: .
    
    container_name: flask-app

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - employee-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db

    restart: always
    env_file:
      - .env
    
    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      timeout: 5s

    networks:
      - employee-network

volumes:
   postgres-data:

networks:
   employee-network:
